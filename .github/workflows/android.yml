name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 1. This generates your missing gradlew files automatically
    - name: Auto-Generate Missing Gradle Wrapper
      run: gradle wrapper

    - name: Grant Execute Permission for Gradle
      run: chmod +x ./gradlew

    # 2. This builds the APK and applies the headless KSP fix
    - name: Build Debug APK with Headless KSP Flag
      run: ./gradlew assembleDebug -Dorg.jetbrains.kotlin.ksp.command.line.mode=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
